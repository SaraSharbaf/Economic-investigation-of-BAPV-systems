[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-retrofit-analysis"
version = "0.1.0"
description = "EnergyPlus retrofit scenario, economics, comfort, and emissions analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "lxml>=5",
  "natsort>=8.4",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
visualization = ["matplotlib>=3.8", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
